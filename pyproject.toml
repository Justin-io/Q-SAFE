[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsafe-defender"
version = "0.1.0"
description = "Explainable defensive file analysis and reversible quarantine"
requires-python = ">=3.10"

[project.scripts]
qsafe = "q_safe.cli:main"

[tool.setuptools.packages.find]
include = ["q_safe*"]
